# Waggle — Release Build Workflow
#
# Builds desktop apps for Windows (NSIS) and macOS (DMG) on tag push.
# Publishes only the certified Windows installer; macOS outputs remain
# workflow verification artifacts until the deferred macOS release gate lands.
#
# Trigger: push tag v* (e.g., v1.0.0). Use tauri-build-pr.yml for manual
# unsigned verification builds; production signing is tag-only.

name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production-windows-signing
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and app version
        shell: pwsh
        run: |
          $version = [string](Get-Content -Raw -LiteralPath 'app/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF -ne "refs/tags/$expectedTag" -or $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not exactly match app version $version"
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch canonical origin/main for release ancestry validation' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag commit is not an ancestor of canonical origin/main' }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install locked Tauri CLI
        run: npm ci --prefix app --ignore-scripts

      - name: Build packages (shared -> core -> agent -> server)
        run: npm run build:packages

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Bundle native dependencies
        run: node scripts/bundle-native-deps.mjs

      - name: Bundle Node.js runtime
        run: node scripts/bundle-node.mjs

      - name: Stage sidecar dependencies
        run: node scripts/stage-sidecar-deps.mjs

      - name: Verify packaged hook lifecycles
        run: node node_modules/vitest/vitest.mjs run --root . --config vitest.config.ts packages/agent/tests/hook-packages-runtime.test.ts -t "runs staged Tauri hook lifecycles"
        env:
          WAGGLE_VERIFY_STAGED_HOOK_RUNTIME: '1'

      - name: Build frontend
        run: cd apps/web && npx vite build

      - name: Import production Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_APPROVED_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_APPROVED_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw 'WINDOWS_CODESIGN_PFX_BASE64 is not configured' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) { throw 'WINDOWS_CODESIGN_PFX_PASSWORD is not configured' }
          $approvedThumbprint = ([string]$env:WINDOWS_CODESIGN_APPROVED_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($approvedThumbprint -notmatch '^[0-9A-F]{40}$') { throw 'WINDOWS_CODESIGN_APPROVED_THUMBPRINT is not configured as 40 hexadecimal characters' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'waggle-codesign.pfx'
          $newThumbprints = @()
          try {
            $existingThumbprints = @(Get-ChildItem -LiteralPath 'Cert:\CurrentUser\My' | ForEach-Object { $_.Thumbprint })
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            $newThumbprints = @(
              $certificates |
                ForEach-Object { $_.Thumbprint } |
                Where-Object { $existingThumbprints -notcontains $_ } |
                Sort-Object -Unique
            )
            $codeSigningOid = '1.3.6.1.5.5.7.3.3'
            $signingCertificates = @(
              $certificates | Where-Object {
                $certificate = $_
                $codeSigningEkus = @(
                  $certificate.Extensions |
                    Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
                    ForEach-Object { $_.EnhancedKeyUsages } |
                    Where-Object { $_.Value -eq $codeSigningOid }
                )
                $certificate.HasPrivateKey -and $codeSigningEkus.Count -gt 0
              }
            )
            if ($signingCertificates.Count -ne 1) {
              throw "Expected exactly one private-key Code Signing leaf, found $($signingCertificates.Count)"
            }
            $signingCertificate = $signingCertificates[0]
            $now = [DateTime]::UtcNow
            if ($signingCertificate.NotBefore.ToUniversalTime() -gt $now -or $signingCertificate.NotAfter.ToUniversalTime() -le $now) {
              throw 'Production Code Signing certificate is not currently valid'
            }
            $thumbprint = $signingCertificate.Thumbprint
            if (-not [string]::Equals($thumbprint, $approvedThumbprint, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Imported Code Signing certificate does not match the independently approved thumbprint'
            }
            Set-Content -LiteralPath 'app/src-tauri/.thumbprint.txt' -Value $thumbprint -NoNewline
            "WAGGLE_CODESIGN_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WAGGLE_APPROVED_CODESIGN_THUMBPRINT=$approvedThumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WAGGLE_IMPORTED_CERT_THUMBPRINTS=$($newThumbprints -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            foreach ($importedThumbprint in $newThumbprints) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$importedThumbprint" -Force -ErrorAction SilentlyContinue
            }
            throw
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Apply Windows signing configuration
        run: node app/scripts/apply-signing-config.mjs

      - name: Build Tauri (Windows)
        run: cd app && node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config src-tauri/tauri.build-override.conf.json

      - name: Remove imported Windows code-signing certificates
        if: always()
        shell: pwsh
        run: |
          $cleanupErrors = @()
          foreach ($importedThumbprint in @($env:WAGGLE_IMPORTED_CERT_THUMBPRINTS -split ',' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })) {
            try {
              $certificatePath = "Cert:\CurrentUser\My\$importedThumbprint"
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
              if (Test-Path -LiteralPath $certificatePath) { throw "Certificate remains in store: $importedThumbprint" }
            } catch {
              $cleanupErrors += $_.Exception.Message
            }
          }
          Remove-Item -LiteralPath 'app/src-tauri/.thumbprint.txt' -Force -ErrorAction SilentlyContinue
          if ($cleanupErrors.Count -gt 0) { throw "Signing certificate cleanup failed: $($cleanupErrors -join '; ')" }

      - name: Reclaim Windows build intermediates for managed-model certification
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $targetRoot = [System.IO.Path]::GetFullPath((Resolve-Path 'app/src-tauri/target').Path)
          $targetPrefix = $targetRoot.TrimEnd([char[]]@('\', '/')) + [System.IO.Path]::DirectorySeparatorChar
          $targetProfileRoot = [System.IO.Path]::GetFullPath((Split-Path -Parent (Split-Path -Parent $installers[0].DirectoryName)))
          if (-not $targetProfileRoot.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to prune outside the Tauri target: $targetProfileRoot"
          }
          foreach ($directoryName in @('deps', 'incremental', 'build', '.fingerprint')) {
            $directory = Join-Path $targetProfileRoot $directoryName
            if (Test-Path -LiteralPath $directory -PathType Container) {
              Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction Stop
            }
          }
          foreach ($requiredDirectory in @('bundle\nsis', 'nsis')) {
            $requiredPath = Join-Path $targetProfileRoot $requiredDirectory
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Container)) {
              throw "Build-intermediate cleanup removed required certificate input: $requiredPath"
            }
          }
          $driveRoot = [System.IO.Path]::GetPathRoot($targetRoot)
          if ($driveRoot -notmatch '^[A-Za-z]:\\$') { throw "Unexpected Tauri target drive: $driveRoot" }
          $drive = Get-PSDrive -Name $driveRoot.Substring(0, 1) -PSProvider FileSystem
          $minimumFreeBytes = 8GB
          if ([int64]$drive.Free -lt $minimumFreeBytes) {
            throw "Managed-model certification requires at least 8 GiB free after pruning; available=$($drive.Free)"
          }

      - name: Certify Windows Solo installer lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $installer = $installers[0]
          & ./scripts/certify-windows-installer.ps1 -InstallerPath $installer.FullName -RequireAuthenticodeSignature -ExpectedSignerThumbprint $env:WAGGLE_APPROVED_CODESIGN_THUMBPRINT -ExpectedSourceRevision $env:GITHUB_SHA -VerifyManagedModel

      - name: Attest certified Windows artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            app/src-tauri/target/**/bundle/nsis/*-setup.exe
            app/src-tauri/target/**/bundle/nsis/windows-installer-certificate.json

      - name: Upload Windows lifecycle certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: waggle-windows-installer-certificate-${{ github.sha }}
          path: app/src-tauri/target/**/bundle/nsis/windows-installer-certificate.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish certified Windows installer
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Assert-RemoteTagCommit {
            param([string]$Tag, [string]$ExpectedCommit)
            $remoteTagLines = @(git ls-remote --tags origin "refs/tags/$Tag" "refs/tags/$Tag^{}")
            if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) { throw "Could not resolve remote release tag $Tag" }
            $resolvedTagLine = @($remoteTagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1)
            if ($resolvedTagLine.Count -eq 0) { $resolvedTagLine = @($remoteTagLines | Select-Object -First 1) }
            $remoteTagSha = ([regex]::Split(([string]$resolvedTagLine[0]).Trim(), '\s+'))[0]
            if (-not [string]::Equals($remoteTagSha, $ExpectedCommit, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Remote release tag $Tag no longer resolves to the certified commit"
            }
          }

          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one certified NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $receipt = Get-Item -LiteralPath (Join-Path $installer.DirectoryName 'windows-installer-certificate.json')
          $receiptData = Get-Content -Raw -LiteralPath $receipt.FullName | ConvertFrom-Json
          if ($receiptData.schemaVersion -ne 2 -or $receiptData.status -ne 'passed') {
            throw 'Windows lifecycle receipt is not a passing schema-v2 certificate'
          }
          if ($receiptData.evidence.sourceRevision -ne $env:GITHUB_SHA) {
            throw 'Lifecycle receipt source revision does not match the release commit'
          }
          if ($receiptData.installer.name -ne $installer.Name -or [int64]$receiptData.installer.sizeBytes -ne $installer.Length) {
            throw 'Lifecycle receipt installer identity does not match the release artifact'
          }
          $installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($installerSha256, [string]$receiptData.installer.sha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Certified installer hash no longer matches the lifecycle receipt'
          }
          if ($receiptData.installer.authenticodeStatus -ne 'Valid' -or
              $receiptData.installedApp.authenticodeStatus -ne 'Valid' -or
              $receiptData.installer.signatureType -ne 'Authenticode' -or
              $receiptData.installedApp.signatureType -ne 'Authenticode') {
            throw 'Lifecycle receipt does not contain valid outer and installed-app signatures'
          }
          foreach ($signerThumbprint in @($receiptData.installer.signerThumbprint, $receiptData.installedApp.signerThumbprint)) {
            if (-not [string]::Equals([string]$signerThumbprint, $env:WAGGLE_APPROVED_CODESIGN_THUMBPRINT, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Lifecycle receipt signer does not match the imported production certificate'
            }
          }
          if ([string]::IsNullOrWhiteSpace([string]$receiptData.installer.timestampAuthorityThumbprint) -or
              [string]::IsNullOrWhiteSpace([string]$receiptData.installedApp.timestampAuthorityThumbprint)) {
            throw 'Lifecycle receipt is missing a validated Authenticode timestamp'
          }
          if ($receiptData.managedModelVerified -ne $true) {
            throw 'Lifecycle receipt does not prove a managed local-model chat completion'
          }
          if ([string]$receiptData.managedModelDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Lifecycle receipt does not bind the managed model to an immutable manifest digest'
          }
          $requiredChecks = @(
            'sourceRevision', 'sourceFilesClean', 'generatedInstallerInclude', 'profileDataDeletionAbsent',
            'baseAppDataDeletionNeutralized', 'authenticodeSignature', 'authenticodeSigner',
            'authenticodeTimestamp', 'installedAppAuthenticodeSignature',
            'installedAppAuthenticodeSigner', 'installedAppAuthenticodeTimestamp',
            'silentInstall', 'vaultKeyAclRestricted', 'windowsInboxTools', 'noModelChatSetupRequired',
            'dockerIndependentRuntimePrerequisites', 'managedRuntimeBootstrap', 'managedModelPull', 'managedModelChat',
            'managedRuntimeCleanup', 'sameVersionRepair', 'relaunchAfterRepair', 'silentUninstall',
            'configuredDataDirPreserved', 'profileDataPathPreserved', 'environmentRestored'
          )
          foreach ($checkName in $requiredChecks) {
            $check = $receiptData.checks.PSObject.Properties[$checkName]
            if ($null -eq $check -or $check.Value -ne $true) { throw "Lifecycle receipt check did not pass: $checkName" }
          }
          $nonPassingChecks = @($receiptData.checks.PSObject.Properties | Where-Object { $_.Value -ne $true })
          if ($nonPassingChecks.Count -gt 0) {
            throw "Lifecycle receipt contains non-passing checks: $($nonPassingChecks.Name -join ', ')"
          }
          $currentCertifierHash = (Get-FileHash -LiteralPath 'scripts/certify-windows-installer.ps1' -Algorithm SHA256).Hash
          $currentHookHash = (Get-FileHash -LiteralPath 'app/src-tauri/nsis/installer.nsi' -Algorithm SHA256).Hash
          $releaseDirectory = Split-Path -Parent (Split-Path -Parent $installer.DirectoryName)
          $generatedInstallerScripts = @(Get-ChildItem -LiteralPath (Join-Path $releaseDirectory 'nsis') -Recurse -Filter 'installer.nsi' -File)
          if ($generatedInstallerScripts.Count -ne 1) { throw 'Could not uniquely resolve generated NSIS source during publication' }
          $currentGeneratedInstallerHash = (Get-FileHash -LiteralPath $generatedInstallerScripts[0].FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($currentCertifierHash, [string]$receiptData.evidence.certifierSha256, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals($currentHookHash, [string]$receiptData.evidence.installerHookSha256, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals($currentGeneratedInstallerHash, [string]$receiptData.evidence.generatedInstallerScriptSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Lifecycle receipt source hashes do not match the release checkout'
          }
          $tag = '${{ github.ref_name }}'
          Assert-RemoteTagCommit $tag $env:GITHUB_SHA
          $releaseJson = gh release view $tag --json isDraft,tagName,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "Waggle $tag" --notes 'See the release notes for details.'
            if ($LASTEXITCODE -ne 0) {
              $releaseJson = gh release view $tag --json isDraft,tagName,assets 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find draft release $tag" }
            }
          }
          $releaseJson = gh release view $tag --json isDraft,tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $tag before upload" }
          $releaseData = $releaseJson | ConvertFrom-Json
          if ($releaseData.tagName -ne $tag) { throw "Release identity does not match tag $tag" }
          if (-not $releaseData.isDraft) { throw "Refusing to modify a published release: $tag" }
          $existingAssetNames = @($releaseData.assets | ForEach-Object { $_.name })
          foreach ($assetName in @($installer.Name, $receipt.Name)) {
            if ($existingAssetNames -contains $assetName) {
              throw "Refusing to replace existing release asset: $assetName"
            }
          }
          Assert-RemoteTagCommit $tag $env:GITHUB_SHA
          gh release upload $tag $installer.FullName $receipt.FullName
          if ($LASTEXITCODE -ne 0) { throw "Could not upload certified Windows assets to $tag" }

  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-15
          - target: x86_64-apple-darwin
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Verify runner architecture
        run: node -e "if (process.arch !== process.env.TARGET_ARCH) { console.error('Expected ' + process.env.TARGET_ARCH + ' runner, got ' + process.arch); process.exit(1); }"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install locked Tauri CLI
        run: npm ci --prefix app --ignore-scripts

      - name: Build packages (shared -> core -> agent -> server)
        run: npm run build:packages

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Bundle native dependencies
        run: node scripts/bundle-native-deps.mjs

      - name: Bundle Node.js runtime
        run: node scripts/bundle-node.mjs

      - name: Stage sidecar dependencies
        run: node scripts/stage-sidecar-deps.mjs

      - name: Build frontend
        run: cd apps/web && npx vite build

      - name: Build Tauri (macOS)
        run: cd app && node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Upload macOS verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waggle-macos-verification-${{ matrix.target }}-${{ github.sha }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7

  # NOTE: the Tauri auto-updater is disabled for v1 (plugins.updater removed from
  # tauri.conf.json — see BUILD P0-2 / P1-8). The former `update-manifest` job
  # published a latest.json with EMPTY signatures, which every client rejected at
  # signature verification. Re-enabling the updater requires:
  #   1. Provision a TAURI_SIGNING_PRIVATE_KEY (+ password) repo secret.
  #   2. Restore `plugins.updater` (endpoints + pubkey) in tauri.conf.json and
  #      set bundle.createUpdaterArtifacts so tauri-action emits signed .sig files.
  #   3. Restore a latest.json generator that reads the real signatures from the
  #      build artifacts (tauri-action can publish the manifest directly).
