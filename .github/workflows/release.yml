# Waggle — Release Build Workflow
#
# Builds desktop apps for Windows (NSIS) and macOS (DMG) on tag push.
# Publishes only the certified Windows installer; macOS outputs remain
# workflow verification artifacts until the deferred macOS release gate lands.
#
# Trigger: push tag v* (e.g., v1.0.0). Use tauri-build-pr.yml for manual
# unsigned verification builds; production signing is tag-only.

name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production-windows-signing
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and app version
        shell: pwsh
        run: |
          $version = [string](Get-Content -Raw -LiteralPath 'app/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF -ne "refs/tags/$expectedTag" -or $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not exactly match app version $version"
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch canonical origin/main for release ancestry validation' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag commit is not an ancestor of canonical origin/main' }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install locked Tauri CLI
        run: npm ci --prefix app --ignore-scripts

      - name: Build packages (shared -> core -> agent -> server)
        run: npm run build:packages

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Bundle native dependencies
        run: node scripts/bundle-native-deps.mjs

      - name: Bundle Node.js runtime
        run: node scripts/bundle-node.mjs

      - name: Stage sidecar dependencies
        run: node scripts/stage-sidecar-deps.mjs

      - name: Verify packaged hook lifecycles
        run: node node_modules/vitest/vitest.mjs run --root . --config vitest.config.ts packages/agent/tests/hook-packages-runtime.test.ts -t "runs staged Tauri hook lifecycles"
        env:
          WAGGLE_VERIFY_STAGED_HOOK_RUNTIME: '1'

      - name: Build frontend
        run: cd apps/web && npx vite build

      - name: Import production Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_APPROVED_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_APPROVED_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) { throw 'WINDOWS_CODESIGN_PFX_BASE64 is not configured' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) { throw 'WINDOWS_CODESIGN_PFX_PASSWORD is not configured' }
          $approvedThumbprint = ([string]$env:WINDOWS_CODESIGN_APPROVED_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($approvedThumbprint -notmatch '^[0-9A-F]{40}$') { throw 'WINDOWS_CODESIGN_APPROVED_THUMBPRINT is not configured as 40 hexadecimal characters' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'waggle-codesign.pfx'
          $newThumbprints = @()
          try {
            $existingThumbprints = @(Get-ChildItem -LiteralPath 'Cert:\CurrentUser\My' | ForEach-Object { $_.Thumbprint })
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password)
            $newThumbprints = @(
              $certificates |
                ForEach-Object { $_.Thumbprint } |
                Where-Object { $existingThumbprints -notcontains $_ } |
                Sort-Object -Unique
            )
            $codeSigningOid = '1.3.6.1.5.5.7.3.3'
            $signingCertificates = @(
              $certificates | Where-Object {
                $certificate = $_
                $codeSigningEkus = @(
                  $certificate.Extensions |
                    Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
                    ForEach-Object { $_.EnhancedKeyUsages } |
                    Where-Object { $_.Value -eq $codeSigningOid }
                )
                $certificate.HasPrivateKey -and $codeSigningEkus.Count -gt 0
              }
            )
            if ($signingCertificates.Count -ne 1) {
              throw "Expected exactly one private-key Code Signing leaf, found $($signingCertificates.Count)"
            }
            $signingCertificate = $signingCertificates[0]
            $now = [DateTime]::UtcNow
            if ($signingCertificate.NotBefore.ToUniversalTime() -gt $now -or $signingCertificate.NotAfter.ToUniversalTime() -le $now) {
              throw 'Production Code Signing certificate is not currently valid'
            }
            $thumbprint = $signingCertificate.Thumbprint
            if (-not [string]::Equals($thumbprint, $approvedThumbprint, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Imported Code Signing certificate does not match the independently approved thumbprint'
            }
            Set-Content -LiteralPath 'app/src-tauri/.thumbprint.txt' -Value $thumbprint -NoNewline
            "WAGGLE_CODESIGN_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WAGGLE_APPROVED_CODESIGN_THUMBPRINT=$approvedThumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WAGGLE_IMPORTED_CERT_THUMBPRINTS=$($newThumbprints -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            foreach ($importedThumbprint in $newThumbprints) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$importedThumbprint" -Force -ErrorAction SilentlyContinue
            }
            throw
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Apply Windows signing configuration
        run: node app/scripts/apply-signing-config.mjs

      - name: Build Tauri (Windows)
        run: cd app && node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config src-tauri/tauri.build-override.conf.json

      - name: Remove imported Windows code-signing certificates
        if: always()
        shell: pwsh
        run: |
          $cleanupErrors = @()
          foreach ($importedThumbprint in @($env:WAGGLE_IMPORTED_CERT_THUMBPRINTS -split ',' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })) {
            try {
              $certificatePath = "Cert:\CurrentUser\My\$importedThumbprint"
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
              if (Test-Path -LiteralPath $certificatePath) { throw "Certificate remains in store: $importedThumbprint" }
            } catch {
              $cleanupErrors += $_.Exception.Message
            }
          }
          Remove-Item -LiteralPath 'app/src-tauri/.thumbprint.txt' -Force -ErrorAction SilentlyContinue
          if ($cleanupErrors.Count -gt 0) { throw "Signing certificate cleanup failed: $($cleanupErrors -join '; ')" }

      - name: Reclaim Windows build intermediates for managed-model certification
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $targetRoot = [System.IO.Path]::GetFullPath((Resolve-Path 'app/src-tauri/target').Path)
          $targetPrefix = $targetRoot.TrimEnd([char[]]@('\', '/')) + [System.IO.Path]::DirectorySeparatorChar
          $targetProfileRoot = [System.IO.Path]::GetFullPath((Split-Path -Parent (Split-Path -Parent $installers[0].DirectoryName)))
          if (-not $targetProfileRoot.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to prune outside the Tauri target: $targetProfileRoot"
          }
          foreach ($directoryName in @('deps', 'incremental', 'build', '.fingerprint')) {
            $directory = Join-Path $targetProfileRoot $directoryName
            if (Test-Path -LiteralPath $directory -PathType Container) {
              Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction Stop
            }
          }
          foreach ($requiredDirectory in @('bundle\nsis', 'nsis')) {
            $requiredPath = Join-Path $targetProfileRoot $requiredDirectory
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Container)) {
              throw "Build-intermediate cleanup removed required certificate input: $requiredPath"
            }
          }
          $driveRoot = [System.IO.Path]::GetPathRoot($targetRoot)
          if ($driveRoot -notmatch '^[A-Za-z]:\\$') { throw "Unexpected Tauri target drive: $driveRoot" }
          $drive = Get-PSDrive -Name $driveRoot.Substring(0, 1) -PSProvider FileSystem
          $minimumFreeBytes = 8GB
          if ([int64]$drive.Free -lt $minimumFreeBytes) {
            throw "Managed-model certification requires at least 8 GiB free after pruning; available=$($drive.Free)"
          }

      - name: Download signed Windows upgrade baseline
        id: upgrade-baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_UPGRADE_BASE_TAG: ${{ vars.WINDOWS_UPGRADE_BASE_TAG }}
          WINDOWS_UPGRADE_BASE_ASSET_NAME: ${{ vars.WINDOWS_UPGRADE_BASE_ASSET_NAME }}
          WINDOWS_UPGRADE_BASE_SHA256: ${{ vars.WINDOWS_UPGRADE_BASE_SHA256 }}
          WINDOWS_UPGRADE_BASE_COMMIT: ${{ vars.WINDOWS_UPGRADE_BASE_COMMIT }}
        run: |
          $baseTag = [string]$env:WINDOWS_UPGRADE_BASE_TAG
          $assetName = [string]$env:WINDOWS_UPGRADE_BASE_ASSET_NAME
          $expectedSha256 = ([string]$env:WINDOWS_UPGRADE_BASE_SHA256).Trim().ToUpperInvariant()
          $expectedBaseCommit = ([string]$env:WINDOWS_UPGRADE_BASE_COMMIT).Trim().ToLowerInvariant()
          if ($baseTag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'WINDOWS_UPGRADE_BASE_TAG must use exact vX.Y.Z format'
          }
          $baseVersion = $Matches['version']
          if ($assetName -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*-setup\.exe$') {
            throw 'WINDOWS_UPGRADE_BASE_ASSET_NAME must be one exact NSIS setup filename'
          }
          if ($expectedSha256 -notmatch '^[0-9A-F]{64}$') {
            throw 'WINDOWS_UPGRADE_BASE_SHA256 must be exactly 64 hexadecimal characters'
          }
          if ($expectedBaseCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'WINDOWS_UPGRADE_BASE_COMMIT must be exactly 40 hexadecimal characters'
          }
          $candidateVersion = [string](Get-Content -Raw -LiteralPath 'app/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$candidateVersion") {
            throw 'Candidate installer version no longer matches the release tag'
          }
          if ([version]$baseVersion -ge [version]$candidateVersion) {
            throw 'The protected Windows upgrade baseline must be older than the candidate'
          }

          $remoteTagLines = @(git ls-remote --tags origin "refs/tags/$baseTag" "refs/tags/$baseTag^{}")
          if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) {
            throw "Could not resolve protected upgrade baseline tag $baseTag"
          }
          $resolvedTagLine = @($remoteTagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1)
          if ($resolvedTagLine.Count -eq 0) { $resolvedTagLine = @($remoteTagLines | Select-Object -First 1) }
          $baseCommit = ([regex]::Split(([string]$resolvedTagLine[0]).Trim(), '\s+'))[0].ToLowerInvariant()
          if ($baseCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the protected upgrade baseline commit'
          }
          if (-not [string]::Equals($baseCommit, $expectedBaseCommit, [System.StringComparison]::Ordinal)) {
            throw 'Protected Windows upgrade baseline tag does not resolve to WINDOWS_UPGRADE_BASE_COMMIT'
          }
          git fetch --no-tags origin "refs/tags/$baseTag"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch protected upgrade baseline tag $baseTag" }
          git merge-base --is-ancestor $baseCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'The protected Windows upgrade baseline is not an ancestor of the candidate release'
          }
          $releaseJson = gh release view $baseTag --json isDraft,isPrerelease,tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect protected upgrade baseline $baseTag" }
          $releaseData = $releaseJson | ConvertFrom-Json
          if ($releaseData.tagName -ne $baseTag -or $releaseData.isDraft -or $releaseData.isPrerelease) {
            throw 'Windows upgrade baseline must be an exact published, non-prerelease release'
          }
          $matchingAssets = @($releaseData.assets | Where-Object { $_.name -eq $assetName })
          if ($matchingAssets.Count -ne 1) {
            throw "Expected exactly one protected upgrade baseline asset named $assetName"
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'waggle-windows-upgrade-baseline'
          if (Test-Path -LiteralPath $downloadRoot) {
            throw "Upgrade baseline directory already exists: $downloadRoot"
          }
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          gh release download $baseTag --pattern $assetName --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the protected Windows upgrade baseline' }
          $downloadedFiles = @(Get-ChildItem -LiteralPath $downloadRoot -File)
          if ($downloadedFiles.Count -ne 1 -or $downloadedFiles[0].Name -ne $assetName) {
            throw 'Downloaded Windows upgrade baseline identity is ambiguous'
          }
          $baseInstaller = $downloadedFiles[0]
          $actualSha256 = (Get-FileHash -LiteralPath $baseInstaller.FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($actualSha256, $expectedSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Downloaded Windows upgrade baseline does not match the protected SHA-256'
          }
          "installer_path=$($baseInstaller.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_commit=$baseCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Certify Windows Solo installer lifecycle
        id: certify-windows
        shell: pwsh
        env:
          WINDOWS_UPGRADE_BASE_SHA256: ${{ vars.WINDOWS_UPGRADE_BASE_SHA256 }}
          WAGGLE_UPGRADE_BASE_INSTALLER_PATH: ${{ steps.upgrade-baseline.outputs.installer_path }}
          WAGGLE_UPGRADE_BASE_VERSION: ${{ steps.upgrade-baseline.outputs.base_version }}
          WAGGLE_UPGRADE_BASE_COMMIT: ${{ steps.upgrade-baseline.outputs.base_commit }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable, found $($installers.Count)" }
          $installer = $installers[0]
          $candidateVersion = [string](Get-Content -Raw -LiteralPath 'app/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$candidateVersion") {
            throw 'Candidate installer version no longer matches the release tag'
          }
          $candidateSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          $cleanReceiptPath = Join-Path $installer.DirectoryName 'windows-installer-certificate.json'
          $upgradeReceiptPath = Join-Path $installer.DirectoryName 'windows-installer-upgrade-certificate.json'

          & ./scripts/certify-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -ReceiptPath $cleanReceiptPath `
            -RequireAuthenticodeSignature `
            -ExpectedSignerThumbprint $env:WAGGLE_APPROVED_CODESIGN_THUMBPRINT `
            -ExpectedSourceRevision $env:GITHUB_SHA `
            -VerifyManagedModel

          & ./scripts/certify-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -ReceiptPath $upgradeReceiptPath `
            -RequireAuthenticodeSignature `
            -ExpectedSignerThumbprint $env:WAGGLE_APPROVED_CODESIGN_THUMBPRINT `
            -ExpectedSourceRevision $env:GITHUB_SHA `
            -RequireVersionToVersionUpgrade `
            -PreviousInstallerPath $env:WAGGLE_UPGRADE_BASE_INSTALLER_PATH `
            -ExpectedPreviousInstallerSha256 $env:WINDOWS_UPGRADE_BASE_SHA256 `
            -ExpectedPreviousVersion $env:WAGGLE_UPGRADE_BASE_VERSION `
            -ExpectedPreviousSourceRevision $env:WAGGLE_UPGRADE_BASE_COMMIT `
            -ExpectedCandidateInstallerSha256 $candidateSha256 `
            -ExpectedCandidateVersion $candidateVersion

          $postCertificationSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($postCertificationSha256, $candidateSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Candidate installer changed during Windows lifecycle certification'
          }
          "candidate_sha256=$candidateSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_version=$candidateVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest certified Windows artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            app/src-tauri/target/**/bundle/nsis/*-setup.exe
            app/src-tauri/target/**/bundle/nsis/windows-installer-certificate.json
            app/src-tauri/target/**/bundle/nsis/windows-installer-upgrade-certificate.json

      - name: Upload Windows lifecycle certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: waggle-windows-installer-certificate-${{ github.sha }}
          path: |
            app/src-tauri/target/**/bundle/nsis/windows-installer-certificate.json
            app/src-tauri/target/**/bundle/nsis/windows-installer-upgrade-certificate.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish certified Windows installer
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_UPGRADE_BASE_TAG: ${{ vars.WINDOWS_UPGRADE_BASE_TAG }}
          WINDOWS_UPGRADE_BASE_ASSET_NAME: ${{ vars.WINDOWS_UPGRADE_BASE_ASSET_NAME }}
          WINDOWS_UPGRADE_BASE_SHA256: ${{ vars.WINDOWS_UPGRADE_BASE_SHA256 }}
          WINDOWS_UPGRADE_BASE_COMMIT: ${{ vars.WINDOWS_UPGRADE_BASE_COMMIT }}
          WINDOWS_CODESIGN_APPROVED_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_APPROVED_THUMBPRINT }}
          WAGGLE_UPGRADE_BASE_INSTALLER_PATH: ${{ steps.upgrade-baseline.outputs.installer_path }}
          WAGGLE_UPGRADE_BASE_VERSION: ${{ steps.upgrade-baseline.outputs.base_version }}
          WAGGLE_UPGRADE_BASE_COMMIT: ${{ steps.upgrade-baseline.outputs.base_commit }}
          WAGGLE_CERTIFIED_CANDIDATE_SHA256: ${{ steps.certify-windows.outputs.candidate_sha256 }}
          WAGGLE_CERTIFIED_CANDIDATE_VERSION: ${{ steps.certify-windows.outputs.candidate_version }}
        run: |
          function Assert-RemoteTagCommit {
            param([string]$Tag, [string]$ExpectedCommit)
            $remoteTagLines = @(git ls-remote --tags origin "refs/tags/$Tag" "refs/tags/$Tag^{}")
            if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) { throw "Could not resolve remote release tag $Tag" }
            $resolvedTagLine = @($remoteTagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1)
            if ($resolvedTagLine.Count -eq 0) { $resolvedTagLine = @($remoteTagLines | Select-Object -First 1) }
            $remoteTagSha = ([regex]::Split(([string]$resolvedTagLine[0]).Trim(), '\s+'))[0]
            if (-not [string]::Equals($remoteTagSha, $ExpectedCommit, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Remote release tag $Tag no longer resolves to the certified commit"
            }
          }

          function Assert-ExpectedAuthenticodeSignature {
            param([System.IO.FileInfo]$Artifact, [string]$ExpectedThumbprint)
            $signature = Get-AuthenticodeSignature -FilePath $Artifact.FullName
            $signerThumbprint = if ($null -eq $signature.SignerCertificate) { '' } else { $signature.SignerCertificate.Thumbprint }
            if ($signature.Status -ne 'Valid' -or
                -not [string]::Equals($signerThumbprint, $ExpectedThumbprint, [System.StringComparison]::OrdinalIgnoreCase) -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "Artifact signature is no longer valid for the approved signer: $($Artifact.FullName)"
            }
          }

          function Assert-PassingWindowsCertificateReceipt {
            param([object]$Receipt, [string]$ExpectedMode, [string]$Label)
            $schemaVersionIsIntegral = (
              $Receipt.schemaVersion -is [int] -or
              $Receipt.schemaVersion -is [long]
            )
            if (-not $schemaVersionIsIntegral -or
                [long]$Receipt.schemaVersion -ne 4 -or
                -not ($Receipt.certificationMode -is [string]) -or
                -not [string]::Equals($Receipt.certificationMode, $ExpectedMode, [System.StringComparison]::Ordinal) -or
                -not ($Receipt.status -is [string]) -or
                -not [string]::Equals($Receipt.status, 'passed', [System.StringComparison]::Ordinal)) {
              throw "$Label is not a passing schema-v4 certificate"
            }
          }

          function Assert-PassingWindowsCertificateCheck {
            param([object]$Receipt, [string]$CheckName, [string]$Label)
            $check = $Receipt.checks.PSObject.Properties[$CheckName]
            if ($null -eq $check -or -not [bool]::True.Equals($check.Value)) {
              throw "$Label check did not pass: $CheckName"
            }
          }

          $installers = @(Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter '*-setup.exe' -File | Where-Object { $_.DirectoryName -match '[\\/]bundle[\\/]nsis$' })
          if ($installers.Count -ne 1) { throw "Expected exactly one certified NSIS installer, found $($installers.Count)" }
          $installer = $installers[0]
          $receipt = Get-Item -LiteralPath (Join-Path $installer.DirectoryName 'windows-installer-certificate.json')
          $upgradeReceipt = Get-Item -LiteralPath (Join-Path $installer.DirectoryName 'windows-installer-upgrade-certificate.json')
          $cleanReceiptData = Get-Content -Raw -LiteralPath $receipt.FullName | ConvertFrom-Json
          $receiptData = Get-Content -Raw -LiteralPath $upgradeReceipt.FullName | ConvertFrom-Json
          Assert-PassingWindowsCertificateReceipt `
            $cleanReceiptData 'same-version-repair' 'Windows clean-install receipt'
          Assert-PassingWindowsCertificateReceipt `
            $receiptData 'version-to-version-upgrade' 'Windows lifecycle receipt'
          if ($receiptData.evidence.sourceRevision -ne $env:GITHUB_SHA -or
              $cleanReceiptData.evidence.sourceRevision -ne $env:GITHUB_SHA) {
            throw 'Lifecycle receipts do not match the release commit'
          }
          if ($receiptData.installer.name -ne $installer.Name -or
              $cleanReceiptData.installer.name -ne $installer.Name -or
              [int64]$receiptData.installer.sizeBytes -ne $installer.Length -or
              [int64]$cleanReceiptData.installer.sizeBytes -ne $installer.Length) {
            throw 'Lifecycle receipt installer identities do not match the release artifact'
          }
          $candidateVersion = [string](Get-Content -Raw -LiteralPath 'app/src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          if ($candidateVersion -notmatch '^\d+\.\d+\.\d+$' -or
              $env:GITHUB_REF_NAME -ne "v$candidateVersion" -or
              $env:WAGGLE_CERTIFIED_CANDIDATE_VERSION -ne $candidateVersion) {
            throw 'Published candidate version is not independently bound to the release tag'
          }
          $installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($installerSha256, $env:WAGGLE_CERTIFIED_CANDIDATE_SHA256, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals($installerSha256, [string]$receiptData.installer.sha256, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals($installerSha256, [string]$cleanReceiptData.installer.sha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Certified installer hash no longer matches both lifecycle receipts and the pre-publication output'
          }
          $baseInstaller = Get-Item -LiteralPath $env:WAGGLE_UPGRADE_BASE_INSTALLER_PATH
          $baseSha256 = (Get-FileHash -LiteralPath $baseInstaller.FullName -Algorithm SHA256).Hash
          if (-not [string]::Equals($env:WAGGLE_UPGRADE_BASE_COMMIT, $env:WINDOWS_UPGRADE_BASE_COMMIT, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Certified Windows upgrade baseline commit no longer matches the protected commit'
          }
          Assert-RemoteTagCommit $env:WINDOWS_UPGRADE_BASE_TAG $env:WAGGLE_UPGRADE_BASE_COMMIT
          if ($env:WINDOWS_UPGRADE_BASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$' -or
              $Matches['version'] -ne [string]$receiptData.upgrade.previousVersion -or
              $Matches['version'] -ne $env:WAGGLE_UPGRADE_BASE_VERSION -or
              [string]$receiptData.upgrade.previousSourceRevision -ne $env:WAGGLE_UPGRADE_BASE_COMMIT -or
              [string]$receiptData.upgrade.candidateVersion -ne $candidateVersion -or
              [string]$receiptData.upgrade.observedPreviousVersion -ne [string]$receiptData.upgrade.previousVersion -or
              [string]$receiptData.upgrade.observedCandidateVersion -ne [string]$receiptData.upgrade.candidateVersion) {
            throw 'Lifecycle receipt does not bind the observed upgrade versions to the protected release versions'
          }
          if ($baseInstaller.Name -ne $env:WINDOWS_UPGRADE_BASE_ASSET_NAME -or
              $receiptData.previousInstaller.name -ne $baseInstaller.Name -or
              [int64]$receiptData.previousInstaller.sizeBytes -ne $baseInstaller.Length -or
              -not [string]::Equals($baseSha256, $env:WINDOWS_UPGRADE_BASE_SHA256, [System.StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals($baseSha256, [string]$receiptData.previousInstaller.sha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Lifecycle receipt previous installer does not match the protected upgrade baseline'
          }
          if ($receiptData.installer.authenticodeStatus -ne 'Valid' -or
              $receiptData.installedApp.authenticodeStatus -ne 'Valid' -or
              $cleanReceiptData.installer.authenticodeStatus -ne 'Valid' -or
              $cleanReceiptData.installedApp.authenticodeStatus -ne 'Valid' -or
              $receiptData.previousInstaller.authenticodeStatus -ne 'Valid' -or
              $receiptData.previousInstalledApp.authenticodeStatus -ne 'Valid' -or
              $receiptData.installer.signatureType -ne 'Authenticode' -or
              $receiptData.installedApp.signatureType -ne 'Authenticode' -or
              $cleanReceiptData.installer.signatureType -ne 'Authenticode' -or
              $cleanReceiptData.installedApp.signatureType -ne 'Authenticode' -or
              $receiptData.previousInstaller.signatureType -ne 'Authenticode' -or
              $receiptData.previousInstalledApp.signatureType -ne 'Authenticode') {
            throw 'Lifecycle receipt does not contain valid previous and candidate signatures'
          }
          $approvedThumbprint = ([string]$env:WINDOWS_CODESIGN_APPROVED_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($approvedThumbprint -notmatch '^[0-9A-F]{40}$') {
            throw 'Protected publication signer thumbprint is invalid'
          }
          Assert-ExpectedAuthenticodeSignature $installer $approvedThumbprint
          Assert-ExpectedAuthenticodeSignature $baseInstaller $approvedThumbprint
          foreach ($signerThumbprint in @(
            $receiptData.previousInstaller.signerThumbprint,
            $receiptData.previousInstalledApp.signerThumbprint,
            $receiptData.installer.signerThumbprint,
            $receiptData.installedApp.signerThumbprint,
            $cleanReceiptData.installer.signerThumbprint,
            $cleanReceiptData.installedApp.signerThumbprint
          )) {
            if (-not [string]::Equals([string]$signerThumbprint, $approvedThumbprint, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Lifecycle receipt signer does not match the imported production certificate'
            }
          }
          foreach ($timestampThumbprint in @(
            $receiptData.previousInstaller.timestampAuthorityThumbprint,
            $receiptData.previousInstalledApp.timestampAuthorityThumbprint,
            $receiptData.installer.timestampAuthorityThumbprint,
            $receiptData.installedApp.timestampAuthorityThumbprint,
            $cleanReceiptData.installer.timestampAuthorityThumbprint,
            $cleanReceiptData.installedApp.timestampAuthorityThumbprint
          )) {
            if ([string]::IsNullOrWhiteSpace([string]$timestampThumbprint)) {
              throw 'Lifecycle receipt is missing a validated Authenticode timestamp'
            }
          }
          if (-not [bool]::True.Equals($cleanReceiptData.managedModelVerified)) {
            throw 'Clean-install receipt does not prove a managed local-model chat completion'
          }
          if ([string]$cleanReceiptData.managedModelDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Clean-install receipt does not bind the managed model to an immutable manifest digest'
          }
          foreach ($certificateData in @($cleanReceiptData, $receiptData)) {
            if ([string]::IsNullOrWhiteSpace([string]$certificateData.lifecycleData.workspaceId) -or
                [long]$certificateData.lifecycleData.personalFrameId -lt 1 -or
                [long]$certificateData.lifecycleData.workspaceFrameId -lt 1 -or
                [int]$certificateData.lifecycleData.preUninstallManifestEntryCount -lt 1 -or
                [string]$certificateData.lifecycleData.preUninstallManifestSha256 -notmatch '^[0-9A-F]{64}$' -or
                [string]$certificateData.lifecycleData.postUninstallManifestSha256 -notmatch '^[0-9A-F]{64}$' -or
                -not [string]::Equals(
                  [string]$certificateData.lifecycleData.preUninstallManifestSha256,
                  [string]$certificateData.lifecycleData.postUninstallManifestSha256,
                  [System.StringComparison]::Ordinal
                )) {
              throw 'Lifecycle receipt does not bind real workspace and memory data to an unchanged uninstall manifest'
            }
          }
          $cleanRequiredChecks = @(
            'sourceRevision', 'sourceFilesClean', 'generatedInstallerInclude', 'profileDataDeletionAbsent',
            'baseAppDataDeletionNeutralized', 'authenticodeSignature', 'authenticodeSigner',
            'authenticodeTimestamp', 'installedAppAuthenticodeSignature',
            'installedAppAuthenticodeSigner', 'installedAppAuthenticodeTimestamp',
            'silentInstall', 'vaultKeyAclRestricted', 'windowsInboxTools', 'noModelChatSetupRequired',
            'dockerIndependentRuntimePrerequisites', 'managedRuntimeBootstrap', 'managedModelPull', 'managedModelChat',
            'managedRuntimeCleanup', 'sameVersionRepair', 'relaunchAfterRepair', 'silentUninstall',
            'defaultProfileDataDir', 'realWorkspaceAndMemorySeeded',
            'repairRealWorkspaceAndMemoryPreserved', 'uninstallRealWorkspaceAndMemoryPreserved',
            'configuredDataDirPreserved', 'profileDataPathPreserved', 'certificateProfileCleanup',
            'environmentRestored'
          )
          $upgradeRequiredChecks = @(
            'sourceRevision', 'sourceFilesClean', 'generatedInstallerInclude', 'profileDataDeletionAbsent',
            'baseAppDataDeletionNeutralized', 'authenticodeSignature', 'authenticodeSigner',
            'authenticodeTimestamp', 'installedAppAuthenticodeSignature',
            'installedAppAuthenticodeSigner', 'installedAppAuthenticodeTimestamp',
            'previousInstallerHash', 'previousInstallerAuthenticodeSignature',
            'previousInstallerAuthenticodeSigner', 'previousInstallerAuthenticodeTimestamp',
            'previousInstalledAppAuthenticodeSignature', 'previousInstalledAppAuthenticodeSigner',
            'previousInstalledAppAuthenticodeTimestamp', 'candidateInstallerHash', 'versionOrder', 'previousVersion',
            'candidateVersion', 'previousInstall', 'previousLaunch', 'sameApprovedSigner',
            'versionToVersionUpgrade', 'upgradeSameInstallDirectory', 'upgradeConfiguredDataPreserved',
            'upgradeProfileDataPreserved', 'upgradeVaultKeyPreserved', 'upgradeRegistrations',
            'candidateLaunch', 'relaunchAfterUpgrade',
            'silentInstall', 'vaultKeyAclRestricted', 'windowsInboxTools', 'noModelChatSetupRequired',
            'dockerIndependentRuntimePrerequisites', 'sameVersionRepair', 'relaunchAfterRepair', 'silentUninstall',
            'defaultProfileDataDir', 'realWorkspaceAndMemorySeeded',
            'upgradeRealWorkspaceAndMemoryPreserved', 'repairRealWorkspaceAndMemoryPreserved',
            'uninstallRealWorkspaceAndMemoryPreserved', 'configuredDataDirPreserved',
            'profileDataPathPreserved', 'certificateProfileCleanup', 'environmentRestored'
          )
          foreach ($checkName in $cleanRequiredChecks) {
            Assert-PassingWindowsCertificateCheck $cleanReceiptData $checkName 'Clean-install receipt'
          }
          foreach ($checkName in $upgradeRequiredChecks) {
            Assert-PassingWindowsCertificateCheck $receiptData $checkName 'Upgrade receipt'
          }
          $nonPassingChecks = @(
            @($cleanReceiptData.checks.PSObject.Properties | Where-Object { -not [bool]::True.Equals($_.Value) }) +
            @($receiptData.checks.PSObject.Properties | Where-Object { -not [bool]::True.Equals($_.Value) })
          )
          if ($nonPassingChecks.Count -gt 0) {
            throw "Lifecycle receipts contain non-passing checks: $($nonPassingChecks.Name -join ', ')"
          }
          $currentCertifierHash = (Get-FileHash -LiteralPath 'scripts/certify-windows-installer.ps1' -Algorithm SHA256).Hash
          $currentHookHash = (Get-FileHash -LiteralPath 'app/src-tauri/nsis/installer.nsi' -Algorithm SHA256).Hash
          $releaseDirectory = Split-Path -Parent (Split-Path -Parent $installer.DirectoryName)
          $generatedInstallerScripts = @(Get-ChildItem -LiteralPath (Join-Path $releaseDirectory 'nsis') -Recurse -Filter 'installer.nsi' -File)
          if ($generatedInstallerScripts.Count -ne 1) { throw 'Could not uniquely resolve generated NSIS source during publication' }
          $currentGeneratedInstallerHash = (Get-FileHash -LiteralPath $generatedInstallerScripts[0].FullName -Algorithm SHA256).Hash
          foreach ($certificateData in @($cleanReceiptData, $receiptData)) {
            if (-not [string]::Equals($currentCertifierHash, [string]$certificateData.evidence.certifierSha256, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals($currentHookHash, [string]$certificateData.evidence.installerHookSha256, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals($currentGeneratedInstallerHash, [string]$certificateData.evidence.generatedInstallerScriptSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Lifecycle receipt source hashes do not match the release checkout'
            }
          }
          $tag = $env:GITHUB_REF_NAME
          Assert-RemoteTagCommit $tag $env:GITHUB_SHA
          $releaseJson = gh release view $tag --json isDraft,tagName,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "Waggle $tag" --notes 'See the release notes for details.'
            if ($LASTEXITCODE -ne 0) {
              $releaseJson = gh release view $tag --json isDraft,tagName,assets 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find draft release $tag" }
            }
          }
          $releaseJson = gh release view $tag --json isDraft,tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release $tag before upload" }
          $releaseData = $releaseJson | ConvertFrom-Json
          if ($releaseData.tagName -ne $tag) { throw "Release identity does not match tag $tag" }
          if (-not $releaseData.isDraft) { throw "Refusing to modify a published release: $tag" }
          $existingAssetNames = @($releaseData.assets | ForEach-Object { $_.name })
          foreach ($assetName in @($installer.Name, $receipt.Name, $upgradeReceipt.Name)) {
            if ($existingAssetNames -contains $assetName) {
              throw "Refusing to replace existing release asset: $assetName"
            }
          }
          Assert-RemoteTagCommit $env:WINDOWS_UPGRADE_BASE_TAG $env:WAGGLE_UPGRADE_BASE_COMMIT
          Assert-RemoteTagCommit $tag $env:GITHUB_SHA
          gh release upload $tag $installer.FullName $receipt.FullName $upgradeReceipt.FullName
          if ($LASTEXITCODE -ne 0) { throw "Could not upload certified Windows assets to $tag" }

  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-15
          - target: x86_64-apple-darwin
            arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Verify runner architecture
        run: node -e "if (process.arch !== process.env.TARGET_ARCH) { console.error('Expected ' + process.env.TARGET_ARCH + ' runner, got ' + process.arch); process.exit(1); }"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install locked Tauri CLI
        run: npm ci --prefix app --ignore-scripts

      - name: Build packages (shared -> core -> agent -> server)
        run: npm run build:packages

      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      - name: Bundle native dependencies
        run: node scripts/bundle-native-deps.mjs

      - name: Bundle Node.js runtime
        run: node scripts/bundle-node.mjs

      - name: Stage sidecar dependencies
        run: node scripts/stage-sidecar-deps.mjs

      - name: Build frontend
        run: cd apps/web && npx vite build

      - name: Build Tauri (macOS)
        run: cd app && node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Upload macOS verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waggle-macos-verification-${{ matrix.target }}-${{ github.sha }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7

  # NOTE: the Tauri auto-updater is disabled for v1 (plugins.updater removed from
  # tauri.conf.json — see BUILD P0-2 / P1-8). The former `update-manifest` job
  # published a latest.json with EMPTY signatures, which every client rejected at
  # signature verification. Re-enabling the updater requires:
  #   1. Provision a TAURI_SIGNING_PRIVATE_KEY (+ password) repo secret.
  #   2. Restore `plugins.updater` (endpoints + pubkey) in tauri.conf.json and
  #      set bundle.createUpdaterArtifacts so tauri-action emits signed .sig files.
  #   3. Restore a latest.json generator that reads the real signatures from the
  #      build artifacts (tauri-action can publish the manifest directly).
