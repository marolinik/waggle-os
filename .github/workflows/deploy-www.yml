name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install at the root (apps/www is a workspace with no lockfile of its own),
      # then build the www workspace. The `npm install → npm ci` switch is deferred
      # to the deps/lockfile hardening pass (see ci.yml note).
      - run: npm install
      - run: cd apps/www && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
