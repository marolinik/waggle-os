# Waggle Teams — Render.com Blueprint
#
# Deploy with one click: https://render.com/deploy
# Or: render blueprint apply
#
# This creates:
# - waggle-server: Node.js web service (serves frontend + API)
# - waggle-postgres: Managed PostgreSQL database
# - waggle-redis: Managed Redis instance

services:
  - type: web
    name: waggle-server
    runtime: node
    plan: starter
    buildCommand: npm install && cd app && npm run build
    startCommand: npx tsx packages/server/src/local/start.ts --skip-litellm
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WAGGLE_SKIP_LITELLM
        value: '1'
      # Sidecar defaults to loopback (desktop-safe); a hosted web service must
      # bind all interfaces, so opt in explicitly.
      - key: WAGGLE_HOST
        value: 0.0.0.0
      - key: WAGGLE_FRONTEND_DIR
        value: ./app/dist
      - key: WAGGLE_DATA_DIR
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: waggle-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: waggle-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: WAGGLE_LICENSE_KEY
        sync: false
      # Stripe billing — without these the sidecar's checkout/webhook routes
      # return 503 and tier upgrades silently never apply in the hosted deploy.
      # STRIPE_SECRET_KEY: API key; STRIPE_WEBHOOK_SECRET: verifies webhook sigs.
      # Prices use the 4-var period contract (priceIdForTier, stripe/index.ts):
      # STRIPE_PRICE_<TIER>_<MONTHLY|ANNUAL>.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_TEAMS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAMS_ANNUAL
        sync: false
    disk:
      name: waggle-data
      mountPath: /data
      sizeGB: 10
    autoDeploy: true

databases:
  - name: waggle-postgres
    plan: starter
    databaseName: waggle
    user: waggle

  - name: waggle-redis
    plan: starter
